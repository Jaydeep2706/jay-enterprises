
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>जय इंटरप्राइजेस | ऑनलाइन दुकान</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f7fa;color:#222}
header{background:linear-gradient(135deg,#075e54,#128c7e);color:white;text-align:center;padding:24px 12px}
header h1{margin:0 0 8px}
header p{margin:5px}
main{max-width:950px;margin:auto;padding:15px}
h2{color:#075e54}
#search{width:100%;padding:13px;border:1px solid #ccc;border-radius:8px;font-size:16px;margin:10px 0 18px}
.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px}
.product{background:white;border-radius:10px;padding:12px;box-shadow:0 2px 8px #0001;text-align:center}
.product img{width:100%;height:120px;object-fit:contain}
.product h3{margin:8px 0}
.price{color:#087b43;font-weight:bold}
button{background:#087b43;color:white;border:0;padding:11px 14px;border-radius:7px;cursor:pointer}
.product button{width:100%}
.panel{background:white;padding:15px;border-radius:10px;margin-top:20px;box-shadow:0 2px 8px #0001}
input,textarea{width:100%;padding:12px;margin:7px 0;border:1px solid #ccc;border-radius:7px;font-size:15px}
.cart-item{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid #eee}
.total{font-weight:bold;font-size:18px;margin-top:12px}
#message{color:#b00020}
footer{text-align:center;padding:20px;color:#666}
</style>
</head>
<body>
<header>
<h1>जय इंटरप्राइजेस</h1>
<p>आपकी अपनी ऑनलाइन दुकान</p>
<p>शिव मंदिर के पास, बंडोल, सिवनी</p>
<p>होम डिलीवरी सुबह 8 बजे से रात 9 बजे तक</p>
</header>

<main>
<h2>हमारे सामान</h2>
<input id="search" type="search" placeholder="सामान खोजें / Search products" oninput="searchProducts(this.value)">
<div id="products" class="products">सामान लोड हो रहा है...</div>

<section class="panel">
<h2>आपकी खरीदारी की टोकरी</h2>
<div id="cart">अभी कोई सामान नहीं जोड़ा गया है।</div>
<div id="bill" class="total"></div>
</section>

<section class="panel">
<h2>ऑर्डर की जानकारी</h2>
<form id="orderForm">
<input id="customer" placeholder="आपका नाम" required>
<input id="phone" type="tel" placeholder="मोबाइल नंबर" required>
<textarea id="address" placeholder="पूरा पता" required></textarea>
<input id="village" placeholder="गाँव / मोहल्ला" required>
<button type="submit">ऑर्डर WhatsApp पर भेजें</button>
</form>
<p id="message"></p>
</section>
</main>

<footer>जय इंटरप्राइजेस | धन्यवाद 🙏</footer>

<script>
let products=[];
let cart={};
let searchText='';

function safe(value){
return String(value??'').replace(/[&<>"']/g,c=>({
'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
}[c]));
}

async function loadProducts(){
try{
const response=await fetch('/api/products');
if(!response.ok)throw new Error('लोड नहीं हुआ');
products=await response.json();
showProducts();
}catch(e){
document.getElementById('products').textContent='सामान लोड नहीं हो सका। कृपया बाद में प्रयास करें।';
}
}

function searchProducts(value){
searchText=value.toLowerCase().trim();
showProducts();
}

function showProducts(){
const area=document.getElementById('products');
const filtered=products.filter(p=>
String(p.name||'').toLowerCase().includes(searchText)||
String(p.name_en||'').toLowerCase().includes(searchText)||
String(p.category||'').toLowerCase().includes(searchText)
);
if(filtered.length===0){
area.textContent=products.length?'कोई सामान नहीं मिला।':'अभी कोई सामान उपलब्ध नहीं है।';
return;
}
area.innerHTML=filtered.map(p=>`
<div class="product">
${p.image?`<img src="${safe(p.image)}" alt="${safe(p.name)}">`:''}
<h3>${safe(p.name)}</h3>
<p>${safe(p.name_en||'')}</p>
<p class="price">₹${Number(p.price).toFixed(2)}</p>
<button onclick="addCart(${Number(p.id)})">कार्ट में जोड़ें</button>
</div>`).join('');
}

function addCart(id){
cart[id]=(cart[id]||0)+1;
showCart();
}

function changeQty(id,change){
cart[id]=(cart[id]||0)+change;
if(cart[id]<=0)delete cart[id];
showCart();
}

function showCart(){
const area=document.getElementById('cart');
const bill=document.getElementById('bill');
const ids=Object.keys(cart);
if(!ids.length){
area.textContent='अभी कोई सामान नहीं जोड़ा गया है।';
bill.textContent='';
return;
}
let total=0;
area.innerHTML=ids.map(id=>{
const p=products.find(x=>Number(x.id)===Number(id));
if(!p)return '';
const amount=Number(p.price)*cart[id];
total+=amount;
return `<div class="cart-item">
<span>${safe(p.name)} × ${cart[id]} = ₹${amount.toFixed(2)}</span>
<span>
<button type="button" onclick="changeQty(${Number(id)},-1)">−</button>
<button type="button" onclick="changeQty(${Number(id)},1)">+</button>
</span></div>`;
}).join('');
const delivery=total>500?0:10;
bill.textContent=`सामान: ₹${total.toFixed(2)} | डिलीवरी: ₹${delivery} | कुल: ₹${(total+delivery).toFixed(2)}`;
}

document.getElementById('orderForm').addEventListener('submit',async function(e){
e.preventDefault();

const ids=Object.keys(cart);
const messageBox=document.getElementById('message');

if(!ids.length){
messageBox.textContent='कृपया पहले सामान कार्ट में जोड़ें।';
return;
}

const items=ids.map(id=>({
product_id:Number(id),
quantity:Number(cart[id])
}));

const total=ids.reduce((sum,id)=>{
const p=products.find(x=>Number(x.id)===Number(id));
return sum+(p?Number(p.price)*cart[id]:0);
},0);

const name=document.getElementById('customer').value.trim();
const phone=document.getElementById('phone').value.trim();
const address=document.getElementById('address').value.trim();
const village=document.getElementById('village').value.trim();

const delivery=total>500?0:10;
const grand=total+delivery;

messageBox.textContent='ऑर्डर सेव हो रहा है...';

try{
const response=await fetch('/api/orders',{
method:'POST',
headers:{'Content-Type':'application/json'},
body:JSON.stringify({
customer_name:name,
phone:phone,
address:address,
village:village,
items:items
})
});

const result=await response.json();

if(!response.ok){
throw new Error(result.error||'ऑर्डर सेव नहीं हुआ');
}

const lines=ids.map(id=>{
const p=products.find(x=>Number(x.id)===Number(id));
return p?`${p.name} x ${cart[id]} = ₹${Number(p.price)*cart[id]}`:'';
});

const whatsappMessage=`नया ऑर्डर - जय इंटरप्राइजेस
ऑर्डर नंबर: ${result.order_id}
नाम: ${name}
मोबाइल: ${phone}
पता: ${address}
गाँव: ${village}

${lines.join('\n')}

सामान: ₹${total}
डिलीवरी: ₹${delivery}
कुल राशि: ₹${grand}`;

window.open('https://wa.me/917389253333?text='+encodeURIComponent(whatsappMessage),'_blank');

messageBox.textContent='ऑर्डर सफलतापूर्वक सेव हो गया। धन्यवाद!';

cart={};
showCart();
document.getElementById('orderForm').reset();

}catch(error){
messageBox.textContent='ऑर्डर सेव नहीं हुआ: '+error.message;
}
});
