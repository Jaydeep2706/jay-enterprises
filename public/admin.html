
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>जय इंटरप्राइजेस एडमिन</title>
<style>
body{font-family:Arial;background:#f1f4f6;margin:0;padding:15px}
.box{background:white;padding:18px;margin:12px auto;border-radius:10px;max-width:600px}
h2{color:#075e54;text-align:center}
input,button,select{box-sizing:border-box;width:100%;padding:12px;margin:7px 0;font-size:16px}
button{background:#075e54;color:white;border:0;border-radius:6px}
#dashboard{display:none}
.item{border-bottom:1px solid #ddd;padding:10px}
#message{white-space:pre-wrap;text-align:center}
</style>
</head>
<body>
<div class="box" id="login">
<h2>जय इंटरप्राइजेस</h2>
<h3>एडमिन लॉगिन</h3>
<form id="loginForm">
<input id="username" placeholder="यूजरनेम" required>
<input id="password" type="password" placeholder="पासवर्ड" required>
<button id="loginBtn">लॉगिन करें</button>
</form>
<p id="message"></p>
</div>

<div id="dashboard">
<div class="box">
<h2>एडमिन डैशबोर्ड</h2>
<button onclick="loadProducts()">सामान की सूची देखें</button>
<button onclick="loadOrders()">ऑर्डर देखें</button>
<button onclick="logout()">लॉगआउट</button>
<p id="status"></p>
</div>

<div class="box">
<h3>नया सामान जोड़ें</h3>
<input id="pname" placeholder="सामान का नाम हिंदी में">
<input id="pnameen" placeholder="Product name in English">
<input id="price" type="number" placeholder="कीमत ₹">
<input id="category" placeholder="श्रेणी">
<input id="image" placeholder="सामान की फोटो का URL (लिंक)">
<button onclick="addProduct()">सामान जोड़ें</button>
</div>

<div class="box">
<h3>सामान की सूची</h3>
<div id="products"></div>
</div>

<div class="box">
<h3>ग्राहकों के ऑर्डर</h3>
<div id="orders"></div>
</div>
</div>

<script>
const $ = id => document.getElementById(id);

async function api(url, options={}) {
  const response = await fetch(url, {
    credentials:'same-origin',
    ...options,
    headers:{'Content-Type':'application/json',...(options.headers||{})}
  });
  const data = await response.json();
  if(!response.ok) throw new Error(data.error || 'कुछ समस्या हुई');
  return data;
}

$('loginForm').addEventListener('submit', async e=>{
  e.preventDefault();
  $('loginBtn').disabled=true;
  $('message').textContent='लॉगिन हो रहा है...';
  try {
    await api('/api/admin/login',{
      method:'POST',
      body:JSON.stringify({
        username:$('username').value.trim(),
        password:$('password').value
      })
    });
    $('login').style.display='none';
    $('dashboard').style.display='block';
    $('message').textContent='';
    loadProducts();
  } catch(err) {
    $('message').textContent=err.message;
  } finally {
    $('loginBtn').disabled=false;
  }
});

async function checkLogin(){
  try {
    await api('/api/admin/me');
    $('login').style.display='none';
    $('dashboard').style.display='block';
    loadProducts();
  } catch(e) {}
}

async function addProduct(){
  try {
    await api('/api/admin/products',{
      method:'POST',
      body:JSON.stringify({
        name:$('pname').value,
        name_en:$('pnameen').value,
        price:$('price').value,
       category:$('category').value,
image:$('image').value
      })
    });
    $('status').textContent='सामान सफलतापूर्वक जुड़ गया';
    $('pname').value='';
    $('pnameen').value='';
    $('price').value='';
    $('category').value='';
    $('image').value='';
    loadProducts();
  } catch(e){$('status').textContent=e.message}
}


async function loadProducts(){
  try {
    const data=await api('/api/products');
    $('products').innerHTML=data.map(p=>
      `<div class="item">
        ${p.image ? `<img src="${escapeHtml(p.image)}" style="width:100px;height:100px;object-fit:contain;"><br>` : ''}
        <b>${escapeHtml(p.name)}</b> — ₹${p.price}<br>
        <button onclick="editProduct(${p.id})">Edit करें</button>
        <button onclick="deleteProduct(${p.id})" style="background:#c62828;">Delete करें</button>
      </div>`
    ).join('') || 'अभी कोई सामान नहीं है';
  } catch(e){$('status').textContent=e.message}
}
